@if (errorMessage) {
  <div class="alert alert-danger">
    {{ errorMessage }}
  </div>
}

<div class="d-flex flex-column align-items-center flex-wrap">
  <form #tikitakForm="ngForm" (ngSubmit)="onSubmitHandler(tikitakForm)">
    <input
      type="text"
      placeholder="Insert Sum URL"
      id="tikitakURL"
      name="tikitakURL"
      autocomplete="off"
      (paste)="onPasteHandler($event)"
      ngModel
      />
      <button type="submit">Go</button>
    </form>

    <blockquote>
      @if (!errorMessage) {
        <iframe
          [attr.src]="srcURL"
          width="100%"
          height="575"
          frameborder="0"
          allowfullscreen
        ></iframe>
      }

      <input type="text" [value]="srcURL" hidden id="URLConverted" />
      @if (displayBtn) {
        <button
          type="button"
          class="btn btn-primary m-2"
          style="width: 100%"
          (click)="copyURL()"
          >
          Copy URL
        </button>
      }

      <a [href]="srcURL" style="width: 100%" class="m-2">
        @if (displayBtn) {
          <button
            type="button"
            style="width: 100%"
            class="btn btn-primary"
            >
            Go to URL
          </button>
        }
      </a>
    </blockquote>
  </div>
